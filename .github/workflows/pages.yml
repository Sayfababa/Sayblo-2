# Builds the game as an installable web app (PWA) and publishes it on GitHub Pages.
# One-time setting in GitHub: Settings › Pages › Source "Deploy from a branch", branch "gh-pages", folder "/ (root)".
# Then the game runs at https://sayfababa.github.io/Sayblo-2/ (iPhone: Safari › Share › Add to Home Screen).
name: Web app (GitHub Pages)

on:
  push:
    branches: [claude/ui-assets]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Publish dist/ to the gh-pages branch
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Web app build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
